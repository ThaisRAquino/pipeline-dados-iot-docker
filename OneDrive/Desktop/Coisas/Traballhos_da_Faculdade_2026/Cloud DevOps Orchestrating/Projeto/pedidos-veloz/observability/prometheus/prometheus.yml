global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: "pedidos-service"
    static_configs:
      - targets: ["pedidos-service:3001"]

  - job_name: "pagamentos-service"
    static_configs:
      - targets: ["pagamentos-service:3002"]

  - job_name: "estoque-service"
    static_configs:
      - targets: ["estoque-service:3003"]
