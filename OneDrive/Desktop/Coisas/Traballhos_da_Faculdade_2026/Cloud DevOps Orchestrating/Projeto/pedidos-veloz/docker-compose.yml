name: pedidos-veloz

# Ambiente de desenvolvimento local padronizado.
# Sobe TODA a plataforma com um único comando:
#   docker compose up --build
#
# Ambiente de observabilidade (Prometheus/Grafana/Jaeger/OTel Collector) é opcional
# e fica em um arquivo separado (docker-compose.observability.yml) para manter o
# ambiente básico enxuto no dia a dia de desenvolvimento:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos-veloz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pedidos_veloz}
      POSTGRES_USER: ${POSTGRES_USER:-pedidos_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pedidos_app} -d ${POSTGRES_DB:-pedidos_veloz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pedidos-veloz-net

  estoque-service:
    build:
      context: ./services/estoque-service
    container_name: pedidos-veloz-estoque
    restart: unless-stopped
    environment:
      SERVICE_NAME: estoque-service
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-pedidos_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-local}
      DB_NAME: ${POSTGRES_DB:-pedidos_veloz}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - pedidos-veloz-net

  pagamentos-service:
    build:
      context: ./services/pagamentos-service
    container_name: pedidos-veloz-pagamentos
    restart: unless-stopped
    environment:
      SERVICE_NAME: pagamentos-service
      PORT: 3002
      TAXA_RECUSA_PAGAMENTO: ${TAXA_RECUSA_PAGAMENTO:-0.1}
      LATENCIA_MIN_MS: ${LATENCIA_MIN_MS:-100}
      LATENCIA_MAX_MS: ${LATENCIA_MAX_MS:-400}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3002:3002"
    networks:
      - pedidos-veloz-net

  pedidos-service:
    build:
      context: ./services/pedidos-service
    container_name: pedidos-veloz-pedidos
    restart: unless-stopped
    environment:
      SERVICE_NAME: pedidos-service
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-pedidos_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha-local}
      DB_NAME: ${POSTGRES_DB:-pedidos_veloz}
      ESTOQUE_SERVICE_URL: http://estoque-service:3003
      PAGAMENTOS_SERVICE_URL: http://pagamentos-service:3002
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      estoque-service:
        condition: service_started
      pagamentos-service:
        condition: service_started
    ports:
      - "3001:3001"
    networks:
      - pedidos-veloz-net

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: pedidos-veloz-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: api-gateway
      PORT: 3000
      PEDIDOS_SERVICE_URL: http://pedidos-service:3001
      PAGAMENTOS_SERVICE_URL: http://pagamentos-service:3002
      ESTOQUE_SERVICE_URL: http://estoque-service:3003
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - pedidos-service
      - pagamentos-service
      - estoque-service
    ports:
      - "3000:3000"
    networks:
      - pedidos-veloz-net

networks:
  pedidos-veloz-net:
    driver: bridge

volumes:
  pgdata:
