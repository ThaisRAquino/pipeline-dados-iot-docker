apiVersion: v1
kind: Namespace
metadata:
  name: pedidos-veloz
  labels:
    app.kubernetes.io/part-of: pedidos-veloz
    # Pod Security Admission (substitui o antigo PodSecurityPolicy, removido no K8s 1.25).
    # Nível "restricted": exige containers non-root, sem privilege escalation,
    # seccomp RuntimeDefault, sem capabilities extras. Ver justificativa no relatório técnico.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
