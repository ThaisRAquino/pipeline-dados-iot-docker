apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-veloz-config
  namespace: pedidos-veloz
data:
  # Configuração não-sensível, comum a vários serviços (12-Factor: III - Config).
  NODE_ENV: "production"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "pedidos_veloz"
  ESTOQUE_SERVICE_URL: "http://estoque-service:3003"
  PAGAMENTOS_SERVICE_URL: "http://pagamentos-service:3002"
  PEDIDOS_SERVICE_URL: "http://pedidos-service:3001"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  TAXA_RECUSA_PAGAMENTO: "0.1"
  LATENCIA_MIN_MS: "100"
  LATENCIA_MAX_MS: "400"
