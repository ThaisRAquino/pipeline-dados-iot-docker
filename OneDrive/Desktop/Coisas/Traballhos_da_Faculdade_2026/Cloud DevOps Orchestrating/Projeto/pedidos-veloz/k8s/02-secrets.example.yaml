# ATENÇÃO: este é um EXEMPLO. Nunca commitar Secrets reais em texto plano no Git.
#
# Fluxo recomendado:
#   1. Copiar este arquivo para "02-secrets.yaml" (já está no .gitignore do repo).
#   2. Substituir os valores por credenciais reais/geradas.
#   3. Em produção, preferir um cofre externo (ex.: HashiCorp Vault, AWS Secrets
#      Manager) integrado via External Secrets Operator, ou Sealed Secrets/SOPS
#      para poder versionar o Secret de forma criptografada. Justificativa no
#      relatório técnico (seção de segurança).
#
# "stringData" é usado aqui só para legibilidade do exemplo; o Kubernetes
# converte automaticamente para base64 (campo "data") ao aplicar.

apiVersion: v1
kind: Secret
metadata:
  name: pedidos-veloz-db-secret
  namespace: pedidos-veloz
type: Opaque
stringData:
  DB_USER: "pedidos_app"
  DB_PASSWORD: "SUBSTITUA-POR-UMA-SENHA-FORTE-E-UNICA"
