apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-service
  namespace: pedidos-veloz
  labels:
    app: pagamentos-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pagamentos-service
  template:
    metadata:
      labels:
        app: pagamentos-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pagamentos-service
          image: ghcr.io/loja-veloz/pedidos-veloz-pagamentos-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: pedidos-veloz-config
          env:
            - name: SERVICE_NAME
              value: "pagamentos-service"
            - name: PORT
              value: "3002"
            # Em produção: chave de API do gateway de pagamento real viria de um Secret,
            # nunca de ConfigMap. Exemplo comentado abaixo:
            # - name: PAYMENT_GATEWAY_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: pedidos-veloz-payment-secret
            #       key: API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-service
  namespace: pedidos-veloz
spec:
  type: ClusterIP
  selector:
    app: pagamentos-service
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pagamentos-service-hpa
  namespace: pedidos-veloz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pagamentos-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
